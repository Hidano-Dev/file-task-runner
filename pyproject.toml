[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-task-runner"
version = "0.1.0"
description = "Run a predefined command on each selected file, one by one."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runner = "file_task_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/file_task_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
